<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#12264b}.title{font-size:40px;font-weight:bold}.subtitle{font-size:21px;fill:#496386}.heading{font-size:22px;font-weight:bold}.body{font-size:17px}.small{font-size:15px;fill:#4b6280}.panel{fill:#f2f8ff;stroke:#3787d3;stroke-width:2}.inner{fill:white;stroke:#c4d9ee;stroke-width:1.5}.arrow{stroke:#2275c4;stroke-width:4;fill:none;marker-end:url(#tip)}</style><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2275c4"/></marker></defs>
