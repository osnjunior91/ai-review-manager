<text x="45" y="58" class="title">AI Review Manager</text><text x="45" y="90" class="subtitle">Architecture Overview (MVP)</text>
<rect x="40" y="160" rx="18" width="215" height="280" class="panel"/><text x="64" y="202" class="heading">Data Source</text><text x="64" y="229" class="small">Simulated reviews</text><rect x="58" y="258" rx="12" width="180" height="116" class="inner"/><text x="78" y="297" class="heading">JSON</text><text x="78" y="327" class="small">reviews_mock.json</text><text x="78" y="351" class="small">100 sample reviews</text>
